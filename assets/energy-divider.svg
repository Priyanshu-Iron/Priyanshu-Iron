<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b1f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#1fb6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <path d="M0 30 Q150 5 300 30 T600 30 T900 30 T1200 30" fill="none" stroke="url(#beam)" stroke-width="3" stroke-dasharray="40 20">
    <animate attributeName="stroke-dashoffset" from="0" to="-600" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M0 30 Q150 55 300 30 T600 30 T900 30 T1200 30" fill="none" stroke="#1fb6ff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="10 30">
    <animate attributeName="stroke-dashoffset" from="0" to="600" dur="4s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(600 30)">
    <circle r="10" fill="#ffd76a" filter="url(#g)">
      <animate attributeName="r" values="7;13;7" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -16 A16 16 0 0 1 16 0 M0 16 A16 16 0 0 1 -16 0" stroke="#ff6a4d" stroke-width="2.5" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
