<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0204"/>
      <stop offset="0.55" stop-color="#2a0507"/>
      <stop offset="1" stop-color="#0b0204"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff3b1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ff3b1f" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="360" y="0" height="320" width="0">
        <animate attributeName="width" from="0" to="840" dur="2.2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- HUD targeting rings -->
  <g transform="translate(190 160)" filter="url(#glow)">
    <circle r="48" fill="url(#core)">
      <animate attributeName="r" values="44;52;44" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="70" fill="none" stroke="#ffd76a" stroke-width="2" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="95" fill="none" stroke="#ff3b1f" stroke-width="3" stroke-dasharray="120 40 20 40">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="120" fill="none" stroke="#ffd76a" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="2 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ffd76a" stroke-width="2">
      <line x1="-140" y1="0" x2="-128" y2="0"/><line x1="128" y1="0" x2="140" y2="0"/>
      <line x1="0" y1="-140" x2="0" y2="-128"/><line x1="0" y1="128" x2="0" y2="140"/>
    </g>
  </g>

  <!-- Title block -->
  <g clip-path="url(#reveal)" font-family="Consolas, 'Courier New', monospace">
    <text x="380" y="92" fill="#ff6a4d" font-size="16" letter-spacing="4">&gt; SYSTEM ONLINE // PILOT IDENTIFIED</text>
    <text x="380" y="160" fill="url(#gold)" font-size="54" font-weight="bold" filter="url(#glow)">PRIYANSHU KUMAR SINGH</text>
    <text x="380" y="205" fill="#ffe9c2" font-size="22" letter-spacing="2">AI ENGINEER · GENAI and BACKEND</text>
    <text x="380" y="245" fill="#ff9f1a" font-size="15" letter-spacing="3">RAG · AGENTS · LANGGRAPH · IDP · COMPUTER VISION</text>
  </g>

  <!-- Blinking status -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
    <circle cx="1080" cy="40" r="5" fill="#39ff88">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1094" y="45" fill="#39ff88">ONLINE</text>
  </g>

  <!-- Scan line sweep -->
  <rect x="0" y="0" width="1200" height="3" fill="#ffd76a" opacity="0.35">
    <animate attributeName="y" values="0;317;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <g stroke="#ffd76a" stroke-width="3" fill="none">
    <path d="M20 50V20H50"/><path d="M1150 20H1180V50"/>
    <path d="M20 270V300H50"/><path d="M1150 300H1180V270"/>
  </g>
</svg>
